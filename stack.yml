name: airflow
title: Apache Airflow
icon: airflow
docs: https://wodby.com/docs/2.0/stacks/catalog/airflow/

services:
- name: airflow
  title: Apache Airflow
  service: airflow
  required: true
  main: true
  links:
  - name: postgres
    service: postgres
  volumes:
  - name: data
    size: 10
- name: postgres
  title: PostgreSQL
  service: postgres
  required: true
  volumes:
  - name: data
    size: 20
