name: airflow
title: Apache Airflow
icon: airflow
docs: https://wodby.com/docs/2.0/stacks/catalog/airflow/
# The main stack of the Airflow variants: the catalog shows this next to the
# link to it on the variants' pages.
variantDescription: >-
  Choose this when you manage DAGs on Airflow's data volume yourself: it runs
  the official Airflow image, with no Git repository to maintain and no builds.

services:
- name: airflow
  title: Apache Airflow
  service: airflow
  required: true
  main: true
  links:
  - name: postgres
    service: postgres
  volumes:
  - name: data
    size: 10
- name: postgres
  title: PostgreSQL
  service: postgres
  required: true
  volumes:
  - name: data
    size: 20
